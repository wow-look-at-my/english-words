name: Build dictionary

on:
  push:
    branches: [master]
    paths: [words_alpha.txt]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add words_alpha.dict.bin words_alpha.dict.bin.gz decompress.js decompress.d.ts .nojekyll index.html
          git diff --cached --quiet || git commit -m "Rebuild compressed dictionary [skip ci]"
          git push
