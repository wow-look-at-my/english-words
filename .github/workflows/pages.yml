name: Rebuild dictionary

on:
  push:
    branches: [master]
    paths: [words_alpha.txt, src/**, package.json]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
